; Anchors Qt's install-relative paths to the exe dir. Without this,
; QLibraryInfo falls back to the BUILD machine's prefix
; (C:/Qt/<ver>/msvc2022_64) — which exists on dev boxes, so everything
; works there by accident, but on a clean end-user machine Qt WebEngine
; then looks for its locale .paks at <exedir>/qtwebengine_locales while
; the installer ships them at <exedir>/translations/qtwebengine_locales.
; Prefix=. gives TranslationsPath=./translations and DataPath=. (so
; WebEngine resources resolve to ./resources), matching the windeployqt
; layout the installer mirrors. Plugins and QML already resolve via the
; app-dir fallbacks, and macOS gets its own qt.conf from macdeployqt.
[Paths]
Prefix = .
