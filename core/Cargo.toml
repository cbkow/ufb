[package]
name = "ufb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "UFB pure-Rust core library (Qt-unaware)"

[lib]
name = "ufb_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
log.workspace = true
once_cell.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Path / file helpers
dirs = "5"
dunce = "1"
glob = "0.3"

# Indexed search ("alt" search mode — Tantivy-backed, vs the OS
# es.exe/mdfind default in search.rs). ignore = ripgrep's parallel
# recursive crawler; notify = cross-platform FS watcher for live index
# updates (FSEvents / ReadDirectoryChangesW).
tantivy = "0.22"
ignore = "0.4"
notify = "7"

# UUIDs — v4 for device IDs, v5 for deterministic volume identities
uuid = { version = "1", features = ["v4", "v5"] }

# URL encoding
urlencoding = "2"

# Hostname (used by mesh node IDs in some flows)
hostname = "0.4"

# Channels (later mesh + transcode use flume; agent client uses tokio mpsc)
flume = "0.11"

# HTTP server (mesh data plane) + client (mesh peer polling)
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Multicast socket construction (mesh udp_notify)
socket2 = { version = "0.5", features = ["all"] }

# File ops support
trash = "5"
fs_extra = "1.3"

# Clipboard helper for cross-platform paths (file_ops)
arboard = "3"

# URL/file opener
opener = { version = "0.7", features = ["reveal"] }

# Native file dialogs (folder picker)
rfd = "0.15"

# Base64 (uri encoding round-trips)
base64 = "0.22"

# md5 used in backup ID hashes
md5 = "0.7"

# Phase 14: thumbnail extractor crates (image, resvg, psd, exr,
# pdfium-render) and sha2 (cache-key hashing) removed - the C++
# Thumbnailer in app/thumbnails/ replaced them.

[dev-dependencies]
# Used by templates::tests for isolated filesystem fixtures.
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# NetFS FFI for GUI-owned plain SMB mounting (macos_mounts.rs, F1)
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "NSWorkspace",
    "NSImage",
    "NSBitmapImageRep",
    "NSGraphicsContext",
    "NSGraphics",
] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
cloud-filter = "0.0.6"
windows = { version = "0.58", features = [
    "implement",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_NetworkManagement_WNet",
] }
windows-core = "0.58"
