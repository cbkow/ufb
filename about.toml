# cargo-about configuration — generates LICENSES/RustCrates-NOTICES.txt
# (see scripts/gen-rust-notices.sh). Every crate compiled into UFB's
# binaries must fall under one of these; a new crate with a license
# outside the list fails the generation on purpose so it gets reviewed
# before it ships. Copyleft entries are deliberately absent: a GPL/LGPL
# crate would need its own entry in THIRD_PARTY_NOTICES.txt.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    # Mozilla's root-certificate bundle (webpki-roots); data, not code.
    "CDLA-Permissive-2.0",
    # UFB's own workspace crates (core, bindings, agent) — listed so
    # cargo-about doesn't reject the project itself; they are the
    # licensor, not a third party, and appear under ../LICENSE.
    "GPL-3.0-or-later",
    # winfsp / winfsp-sys: GPL-3.0 with the WinFsp FLOSS exception —
    # already a first-class entry (#8) in THIRD_PARTY_NOTICES.txt.
    "GPL-3.0",
]
# Only what actually links into the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Resolve the dependency graph for the two shipped targets only.
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
