[workspace]
resolver = "2"
members = [
    "core",
    "bindings",
]
# Agent is a standalone crate — kept out of the workspace so its
# rusqlite/r2d2 versions don't have to match core's, and it can build
# and ship independently. Built via `just agent` or `cargo build
# --manifest-path agent/Cargo.toml`.
exclude = ["agent"]

[workspace.package]
version = "1.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Chris Bialkowski"]
rust-version = "1.85"

[workspace.dependencies]
# Shared dependencies pinned once; member crates pull from here.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"
anyhow = "1"
thiserror = "2"

# In dev builds, compile dependencies at opt-level=2 so CPU-bound
# crates (image, jpeg-decoder, resvg, etc.) aren't 10-50× slower.
# Our own crates stay opt-level=0 for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
