title: UFB
description: Union File Browser — manual and downloads
remote_theme: just-the-docs/just-the-docs

logo: "/images/ufb-logo.png"

# The appcast-*.xml files in this folder are served as static files at ufbrowser.com: appcast-mac.xml is the live
# Sparkle feed of the macOS application; appcast-win.xml is frozen (Windows ships through the Microsoft Store).
color_scheme: dark
enable_dark_mode: true

just_the_docs:
  custom_css:
    - custom/custom.scss

